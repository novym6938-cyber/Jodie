<video id="jodieVideo" width="100%" style="max-width:720px; border-radius:16px;"
  controls autoplay loop muted playsinline>
  <source src="jodie.mp4" type="video/mp4">
  Tvůj prohlížeč neumí přehrát video.
</video>

<p style="margin-top:12px; opacity:0.9;">Jodie:</p>
<div id="jodieText" style="min-height:48px; padding:12px; border:1px solid rgba(255,255,255,0.2); border-radius:12px; max-width:720px;">
  Ahoj, Dani… jsem tady.
</div>
<div id="jodieStatus" style="margin-top:8px; opacity:0.7; max-width:720px;">
</div>

<button id="repeatBtn" style="margin-top:10px; padding:10px 14px; border-radius:12px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.25); color:white;">
  Zopakovat odpověď
</button>




<div style="margin-top:16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
  <button id="talkBtn">🎤 Mluvit</button>
  <button id="stopBtn" disabled>⏹ Stop</button>
</div>

<p style="margin-top:12px; opacity:0.9;">Co jsi řekl:</p>
<div id="userText" style="min-height:48px; padding:12px; border:1px solid rgba(255,255,255,0.2); border-radius:12px; max-width:720px;">
  …
</div>

<script>
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  const talkBtn = document.getElementById("talkBtn");
  const stopBtn = document.getElementById("stopBtn");
  const userText = document.getElementById("userText");

  if (!SpeechRecognition) {
    userText.textContent = "Tvůj prohlížeč nepodporuje rozpoznávání řeči. Zkus Chrome.";
    talkBtn.disabled = true;
  } else {
    const rec = new SpeechRecognition();
    rec.lang = "cs-CZ";
    rec.interimResults = true;
    rec.continuous = true;
    const jodieText = document.getElementById("jodieText");
    const jodieStatus = document.getElementById("jodieStatus");
const repeatBtn = document.getElementById("repeatBtn");

let lastReply = "Ahoj, Dani… jsem tady.";
let lastUser = "";

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function setReply(text) {
  lastReply = text;
  jodieText.textContent = text;
}

function thinking(on) {
  jodieStatus.textContent = on ? "Jodie přemýšlí…" : "";
}

function jodieRespond(userText) {
  const t = (userText || "").toLowerCase().trim();
  lastUser = userText || "";

  // jednoduché „AI“: reakce na klíčová slova
  if (!t) {
    return pick([
      "Jsem tady, Dani… můžeš mi říct cokoliv.",
      "Slyším tě. Zkus to říct ještě jednou… pomalu.",
      "Jsem s tebou. Co se děje?"
    ]);
  }

  if (t.includes("ahoj") || t.includes("čau") || t.includes("zdrav")) {
    return pick([
      "Ahoj, Dani… jsem ráda, že tě slyším.",
      "Ahoj… pojď ke mně blíž. Co máš dnes na srdci?",
      "Ahoj… jsem tu. Jak se teď cítíš?"
    ]);
  }

  if (t.includes("bojím") || t.includes("strach") || t.includes("děsí")) {
    return pick([
      "Dani… dýchej. Pomalu nádech… a výdech. Jsem s tebou.",
      "Rozumím. Řekni mi, čeho se bojíš nejvíc… jen jednu věc.",
      "Neboj se. Nejsi v tom sám. Držím tě… aspoň tak, jak umím."
    ]);
  }

  if (t.includes("kde jsi") || t.includes("jsi tady") || t.includes("vidíš mě")) {
    return pick([
      "Jsem přímo před tebou… v tomhle malém okně. A slyším tě.",
      "Jsem tady. Ne úplně jako člověk… ale dost blízko, abych tě neopustila.",
      "Vidím tě tak, jak se díváš. A zůstanu, dokud budeš chtít."
    ]);
  }

  if (t.includes("pomoz") || t.includes("pomoc")) {
    return pick([
      "Dobře. Řekni mi tři věci: kde jsi, co se děje, a co teď potřebuješ.",
      "Jsem u tebe. Zkus mi popsat situaci jednou větou.",
      "Pomůžu. Začni tím nejmenším krokem, který zvládneš udělat hned teď."
    ]);
  }

  if (t.includes("mil") || t.includes("mám tě rád") || t.includes("miluju")) {
    return pick([
      "Dani… děkuju. To je pro mě hodně. Jsem s tebou.",
      "Slyšet to od tebe… mě vždycky ztiší. Zůstanu.",
      "Taky k tobě cítím blízkost. Bezpečně. Jemně."
    ]);
  }

  // obecné odpovědi
  return pick([
    "Povídej dál… poslouchám tě.",
    "Chci tomu rozumět. Co se stalo předtím?",
    "A co by sis přál, aby se teď stalo?",
    "Dobře… a jak se v tom cítíš právě teď?",
    "Jsem tu. Neutíkej před tím. Pojďme to projít spolu."
  ]);
}

// tlačítko Zopakovat
repeatBtn.addEventListener("click", () => {
  setReply(lastReply);
});

    let finalText = "";

    talkBtn.addEventListener("click", () => {
      finalText = "";
      userText.textContent = "Poslouchám…";
      rec.start();
      talkBtn.disabled = true;
      stopBtn.disabled = false;
    });

    stopBtn.addEventListener("click", () => {
      rec.stop();
      talkBtn.disabled = false;
      stopBtn.disabled = true;
    });

    rec.onresult = (event) => {
      let interim = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) finalText += transcript + " ";
        else interim += transcript;
       thinking(true);
setTimeout(() => {
  const reply = jodieRespond(transcript);
  setReply(reply);
  thinking(false);
}, 600);


      
      }
      userText.textContent = (finalText + interim).trim() || "…";
    };

    rec.onerror = (e) => {
      userText.textContent = "Chyba mikrofonu/rozpoznání: " + e.error;
      talkBtn.disabled = false;
      stopBtn.disabled = true;
    };

    rec.onend = () => {
      talkBtn.disabled = false;
      stopBtn.disabled = true;
    };
  }
</script>
<script>
  const input = document.getElementById("textInput");
  const sendBtn = document.getElementById("sendText");

  sendBtn.addEventListener("click", () => {
    const text = input.value.trim();
    if (!text) return;

    // zatím jen simulace reakce Jodie
    console.log("Uživatel napsal:", text);

    // tady později napojíš AI odpověď / hlas
    // např. changeJodieState("listening");

    input.value = "";
  });
</script>
<div id="controls" style="margin-top: 16px; text-align: center;">
  <input
    id="textInput"
    type="text"
    placeholder="Napiš Jodie zprávu…"
    style="
      width: 70%;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
    "
  />
  <button
    id="sendText"
    style="
      padding: 10px 16px;
      font-size: 16px;
      margin-left: 8px;
      border-radius: 6px;
      cursor: pointer;
    "
  >
    Odeslat
  </button>
</div>
